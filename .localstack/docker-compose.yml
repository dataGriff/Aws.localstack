# Fresh LocalStack per `task local:up`; `task local:down` discards all state (-v).
# S3 Tables, container-image Lambdas and ECR need the licensed image and LOCALSTACK_AUTH_TOKEN.
# Tag is CalVer (YYYY.MM); the old SemVer `:4` line is frozen at 4.14.0 and fails license
# activation with exit 55. Bump the month deliberately, not automatically.
services:
  localstack:
    image: localstack/localstack-pro:2026.08
    container_name: localstack
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?LOCALSTACK_AUTH_TOKEN is required}
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - PERSISTENCE=0
      - LAMBDA_KEEPALIVE_MS=60000
      - ENFORCE_IAM=0
    volumes:
      - "./volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"lambda\"'"]
      interval: 5s
      timeout: 5s
      retries: 40
