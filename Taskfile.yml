# https://taskfile.dev — every developer and CI command lives here. CI calls these same targets.
version: "3"

dotenv: [".env"]

vars:
  ENV: '{{.ENV | default "local"}}'
  FUNCTIONS_ZIP: translator reconcile_invoice
  LOCALSTACK_ENDPOINT: "http://localhost.localstack.cloud:4566"
  LOCAL_REGION: "eu-west-1"
  APP: "--app 'uv run python infra/app.py'"

env:
  UV_PYTHON: "3.12"
  CDK_DISABLE_CLI_TELEMETRY: "true"
  ASYNCAPI_METRICS: "false"

tasks:
  default:
    cmds: [task --list]
    silent: true

  setup:
    desc: Install Python and Node dependencies (tool versions come from mise)
    cmds:
      - uv sync --all-extras
      - npm ci --no-audit --no-fund

  lint:
    desc: Ruff (lint + format check) and mypy
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy

  format:
    desc: Auto-fix lint issues and format
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  test:unit:
    desc: Fast unit tests, no emulator (includes CDK template guard rails)
    cmds:
      - uv run pytest tests/unit -q

  test:contracts:
    desc: Validate the AsyncAPI document and every fixture against its schema
    cmds:
      - npx --no-install asyncapi validate contracts/asyncapi.yaml
      - uv run pytest tests/contracts -q

  build:
    desc: Bundle zip Lambdas into build/ and export the writer image requirements
    cmds:
      - uv run python tools/build/bundle.py {{.FUNCTIONS_ZIP}}
    sources:
      - src/**/*.py
      - contracts/**/*
      - pyproject.toml
      - uv.lock
      - tools/build/bundle.py
    generates:
      - build/**/*

  synth:
    desc: CDK synth for ENV (default local; no credentials needed)
    deps: [build]
    cmds:
      - npx --no-install cdk synth {{.APP}} -c env={{.ENV}} --quiet

  diff:
    desc: CDK diff against the deployed ENV (needs AWS credentials)
    deps: [build]
    cmds:
      - npx --no-install cdk diff {{.APP}} -c env={{.ENV}} --all

  # ---------------------------------------------------------------- LocalStack
  local:up:
    desc: Start a fresh LocalStack container (needs LOCALSTACK_AUTH_TOKEN)
    cmds:
      - docker compose -f .localstack/docker-compose.yml up -d --wait --wait-timeout 180
      - uv run python tools/localstack/wait.py
    env: { AWS_ENDPOINT_URL: "{{.LOCALSTACK_ENDPOINT}}" }

  local:down:
    desc: Stop LocalStack and discard its state
    cmds:
      - docker compose -f .localstack/docker-compose.yml down -v --remove-orphans

  local:logs:
    desc: Save LocalStack logs to .localstack/logs/localstack.log (CI uploads it on failure)
    cmds:
      - mkdir -p .localstack/logs
      - docker compose -f .localstack/docker-compose.yml logs --no-color > .localstack/logs/localstack.log 2>&1 || true

  local:deploy:
    desc: Bootstrap and deploy all stacks to LocalStack with cdklocal
    deps: [build]
    cmds:
      - npx --no-install cdklocal bootstrap {{.APP}} -c env=local
      - npx --no-install cdklocal deploy {{.APP}} -c env=local --all --require-approval never --outputs-file build/outputs.local.json
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: "{{.LOCAL_REGION}}"
      AWS_REGION: "{{.LOCAL_REGION}}"
      CDK_DEFAULT_ACCOUNT: "000000000000"
      CDK_DEFAULT_REGION: "{{.LOCAL_REGION}}"

  local:seed:
    desc: Replay all generator fixtures onto the local ingress bus
    cmds:
      - uv run python -m tools.generator --env local --sets valid,duplicates,out_of_order,invalid
    env:
      AWS_ENDPOINT_URL: "{{.LOCALSTACK_ENDPOINT}}"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: "{{.LOCAL_REGION}}"
      AWS_REGION: "{{.LOCAL_REGION}}"

  test:integration:
    desc: Integration tests against the deployed LocalStack stacks
    cmds:
      - uv run pytest tests/integration -q -m integration -o addopts="" -ra
    env:
      TARGET_ENV: local
      OUTPUTS_FILE: build/outputs.local.json
      AWS_ENDPOINT_URL: "{{.LOCALSTACK_ENDPOINT}}"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: "{{.LOCAL_REGION}}"
      AWS_REGION: "{{.LOCAL_REGION}}"

  query:
    desc: DuckDB over the local Iceberg archive tables (SQL="..." or FILE=path.sql to run non-interactively)
    cmds:
      - uv run python -m tools.query --env local {{if .SQL}}--sql "{{.SQL}}"{{end}} {{if .FILE}}--file "{{.FILE}}"{{end}}
    env:
      AWS_ENDPOINT_URL: "{{.LOCALSTACK_ENDPOINT}}"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: "{{.LOCAL_REGION}}"
      AWS_REGION: "{{.LOCAL_REGION}}"

  # ---------------------------------------------------------------- AWS
  deploy:
    desc: Deploy all stacks to AWS for ENV (task deploy ENV=dev). Uses ambient AWS credentials.
    deps: [build]
    preconditions:
      - sh: 'test "{{.ENV}}" != "local"'
        msg: "deploy targets AWS; use local:deploy for LocalStack"
      - sh: 'test -n "$AWS_REGION"'
        msg: "AWS_REGION must be set"
    cmds:
      - npx --no-install cdk deploy {{.APP}} -c env={{.ENV}} --all --require-approval never --outputs-file build/outputs.{{.ENV}}.json

  smoke:
    desc: Post-deploy smoke test for ENV (task smoke ENV=dev). One synthetic event, asserted in the archive.
    preconditions:
      - sh: 'test "{{.ENV}}" != "local"'
        msg: "smoke targets AWS; integration tests cover local"
    cmds:
      - uv run python -m tools.smoke --env {{.ENV}}
